<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#f7a8c4; --ink:#e9e9ef; --muted:#8f8f9c; --dim:#5a5a66;
    --bg0:#0a0a0c; --bg1:#0e0e12; --line:#23232b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'JetBrains Mono', ui-monospace, 'Liberation Mono', monospace;
    background:var(--bg0); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:70px 20px; position:relative; overflow-x:hidden;
  }
  /* faint grain + scanlines */
  .fx{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .scan{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);}
  /* HUD corner brackets */
  .hud{position:fixed; width:26px; height:26px; border:2px solid var(--pink); opacity:.55; z-index:2; pointer-events:none;}
  .hud.tl{top:16px; left:16px; border-right:none; border-bottom:none;}
  .hud.tr{top:16px; right:16px; border-left:none; border-bottom:none;}
  .hud.bl{bottom:16px; left:16px; border-right:none; border-top:none;}
  .hud.br{bottom:16px; right:16px; border-left:none; border-top:none;}
 
  .wrap{position:relative; z-index:3; width:100%; max-width:520px; text-align:center;}
  .wrap > *{opacity:0; transform:translateY(12px); animation:rise .6s ease forwards;}
  .wrap > *:nth-child(2){animation-delay:.08s}
  .wrap > *:nth-child(3){animation-delay:.16s}
  .wrap > *:nth-child(4){animation-delay:.24s}
  .wrap > *:nth-child(5){animation-delay:.32s}
  .wrap > *:nth-child(6){animation-delay:.40s}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}
 
  /* hero: wings + reticle behind the name */
  .hero{position:relative; height:300px; display:flex; align-items:center; justify-content:center; margin-bottom:6px;}
  .hero svg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(680px,108vw); height:auto; z-index:0;}
  .hero .name-wrap{position:relative; z-index:1;}
  .prompt{font-size:13px; color:var(--muted); margin-bottom:6px; letter-spacing:1px;}
  .prompt .p{color:var(--pink);}
  .name{font-size:84px; font-weight:700; letter-spacing:4px; color:#f4f4f8; line-height:1;
    text-shadow:3px -2px 0 rgba(120,120,135,.35);}
  .name .car{display:inline-block; width:16px; height:64px; background:var(--pink);
    margin-left:8px; transform:translateY(8px); box-shadow:0 0 14px var(--pink);
    animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .fallen{font-family:'Pinyon Script', cursive; font-size:40px; color:#d7d7e0; margin-top:-2px;
    text-shadow:0 0 18px rgba(247,168,196,.25);}
 
  .tagline{font-size:15px; color:var(--muted); margin:14px 0 30px; letter-spacing:.5px;}
  .tagline .p{color:var(--pink);}
 
  .links{display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .btn{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
    font-size:14px; letter-spacing:1px; padding:13px 16px; background:rgba(255,255,255,.025);
    border:1px solid var(--line); transition:all .18s ease;}
  .btn .arw{color:var(--dim); transition:all .18s ease;}
  .btn .lbl{flex:1; text-align:left;}
  .btn .tag{color:var(--dim); font-size:12px;}
  .btn:hover{border-color:var(--pink); background:rgba(247,168,196,.06); transform:translateX(4px);}
  .btn:hover .arw{color:var(--pink);}
  .btn:hover .tag{color:var(--muted);}
 
  .learning{font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:26px;}
  footer{font-size:11px; color:var(--dim); letter-spacing:2px;}
 
  @media(max-width:440px){ .name{font-size:62px} .name .car{height:48px} .fallen{font-size:32px} .hero{height:240px} }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important} .wrap>*{opacity:1;transform:none} }
</style>
</head>
